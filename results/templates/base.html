<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIST Result Portal — Sathyabama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg:       #0d0505;
            --bg2:      #1a0808;
            --bg3:      #2a0f0f;
            --accent:   #8b1a1a;
            --accent2:  #e87722;
            --maroon:   #8b1a1a;
            --orange:   #e87722;
            --green:    #10b981;
            --red:      #ef4444;
            --yellow:   #f59e0b;
            --text:     #f0e6e6;
            --muted:    #b09090;
            --border:   rgba(139,26,26,0.25);
            --glass:    rgba(139,26,26,0.06);
            --glass2:   rgba(139,26,26,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #6b0f0f 0%, #8b1a1a 50%, #a02020 100%);
            border-bottom: 2px solid #e87722;
            padding: 14px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(139,26,26,0.5);
        }
        .navbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: white !important;
            letter-spacing: 0.5px;
        }
        .nav-user { color: rgba(255,255,255,0.8); font-size: 0.85rem; }
        .btn-logout {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 0.85rem;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-logout:hover {
            background: #e87722;
            border-color: #e87722;
            color: white;
        }

        /* Glass Cards */
        .glass-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: var(--glass2);
            border-color: rgba(232,119,34,0.4);
            transform: translateY(-2px);
        }

        /* Stat Cards */
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: var(--orange);
            background: var(--glass2);
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--orange);
            line-height: 1;
        }
        .stat-card .label {
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 6px;
        }

        /* Buttons */
        .btn-accent {
            background: linear-gradient(135deg, #8b1a1a, #a02020);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 9px 20px;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }
        .btn-accent:hover {
            background: linear-gradient(135deg, #e87722, #cf6510);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(232,119,34,0.4);
            color: white;
        }
        .btn-glass {
            background: var(--glass2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 20px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }
        .btn-glass:hover {
            background: var(--glass);
            color: var(--text);
            border-color: var(--orange);
        }
        .btn-danger-glass {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            padding: 9px 20px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-danger-glass:hover { background: #ef4444; color: white; }

        .btn-edit {
            background: rgba(232,119,34,0.12);
            color: var(--orange);
            border: 1px solid rgba(232,119,34,0.3);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 0.82rem;
            transition: all 0.2s;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-edit:hover { background: var(--orange); color: white; }

        .btn-del {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 0.82rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-del:hover { background: #ef4444; color: white; }

        .btn-view {
            background: rgba(16,185,129,0.1);
            color: #10b981;
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 0.82rem;
            transition: all 0.2s;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-view:hover { background: #10b981; color: white; }

        /* Tables */
        .dark-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .dark-table thead th {
            background: rgba(139,26,26,0.4);
            color: var(--orange);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
        }
        .dark-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .dark-table tbody tr:hover { background: var(--glass2); }
        .dark-table td {
            padding: 12px 16px;
            font-size: 0.9rem;
            color: var(--text);
            vertical-align: middle;
        }

        /* AI Box */
        .ai-box {
            background: linear-gradient(135deg,
                rgba(139,26,26,0.12), rgba(139,26,26,0.05));
            border: 1px solid rgba(232,119,34,0.3);
            border-left: 4px solid var(--orange);
            border-radius: 14px;
            padding: 24px;
            margin-top: 20px;
        }
        .ai-box h5 { color: var(--orange); font-weight: 600; }

        /* Welcome Banner */
        .welcome-banner {
            background: linear-gradient(135deg,
                rgba(139,26,26,0.35) 0%,
                rgba(232,119,34,0.2) 100%);
            border: 1px solid rgba(232,119,34,0.3);
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 24px;
        }

        /* Grade Badges */
        .badge-grade {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .grade-O { background: rgba(16,185,129,0.2);  color: #10b981; }
        .grade-A { background: rgba(232,119,34,0.2);  color: #e87722; }
        .grade-B { background: rgba(139,26,26,0.25);  color: #e07070; }
        .grade-C { background: rgba(245,158,11,0.2);  color: #f59e0b; }
        .grade-D { background: rgba(100,100,100,0.2); color: #aaa; }
        .grade-F { background: rgba(239,68,68,0.2);   color: #ef4444; }

        /* Form Inputs */
        .dark-input {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 10px 16px;
            width: 100%;
            transition: all 0.2s;
        }
        .dark-input:focus {
            outline: none;
            border-color: var(--orange);
            background: var(--glass2);
            box-shadow: 0 0 0 3px rgba(232,119,34,0.15);
            color: var(--text);
        }
        .dark-input::placeholder { color: var(--muted); }
        .dark-select {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 10px 16px;
            width: 100%;
        }
        .dark-select option { background: var(--bg2); color: var(--text); }
        .form-label-dark {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        /* Progress Bars */
        .prog-bar {
            height: 4px;
            background: var(--glass2);
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        .prog-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .prog-green  { background: #10b981; }
        .prog-yellow { background: var(--orange); }
        .prog-red    { background: #ef4444; }

        /* Semester Tabs */
        .sem-tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--muted);
            text-decoration: none;
            transition: all 0.2s;
        }
        .sem-tab:hover, .sem-tab.active {
            background: var(--maroon);
            border-color: var(--orange);
            color: white;
        }

        /* Alerts */
        .alert-glass {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            color: #fca5a5;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .alert-success-glass {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 10px;
            color: #6ee7b7;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        /* Section Title */
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
        }
        .section-title span {
            color: var(--muted);
            font-weight: 400;
            font-size: 0.85rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb {
            background: var(--maroon);
            border-radius: 4px;
        }

        .container { max-width: 1200px; }

        /* Suggestion rows */
        .border-green  { border-left: 3px solid #10b981 !important; }
        .border-yellow { border-left: 3px solid var(--orange) !important; }
        .border-red    { border-left: 3px solid #ef4444 !important; }
        .status-green  { background:rgba(16,185,129,0.15); color:#10b981; }
        .status-yellow { background:rgba(232,119,34,0.15); color:var(--orange); }
        .status-red    { background:rgba(239,68,68,0.15);  color:#ef4444; }
        .suggestion-row {
            background: rgba(139,26,26,0.06);
            border-radius: 0 8px 8px 0;
            padding: 10px 14px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center">
    <span class="navbar-brand">
        🎓 SIST Result Portal
    </span>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-3">
        <span class="nav-user">👤 {{ user.username }}</span>
        <a href="/logout/" class="btn-logout">Logout</a>
    </div>
    {% endif %}
</nav>

{% if messages %}
<div class="container mt-3">
    {% for msg in messages %}
    <div class="{% if msg.tags == 'success' %}alert-success-glass{% else %}alert-glass{% endif %}">
        {{ msg }}
    </div>
    {% endfor %}
</div>
{% endif %}

<div class="container mt-4 pb-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
